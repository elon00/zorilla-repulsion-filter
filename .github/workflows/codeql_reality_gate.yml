name: "QMOOSA DevSecOps Reality Gate & CodeQL"

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  reality-check:
    name: "Automated Reality Verification Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform Static CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Execute Automated Smoke, Sanity & Regression Suite
        run: |
          python -m pytest tests/test_reality_suite.py -v --tb=short
